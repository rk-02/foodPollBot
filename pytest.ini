[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
markers =
    unit: fast unit tests
    integration: handler-level integration tests
    e2e: end-to-end scenarios with mocks
addopts = --strict-markers --strict-config --cov=app --cov-report=term-missing --cov-fail-under=90
